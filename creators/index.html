<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creator Portal</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* One calm column. Top bar, a short summary, then the list you act on. Status = coloured pill. */
:root{
  --bg:#f6f7f9; --surface:#fff; --line:#e3e6eb; --fg:#151a22; --muted:#5f6b7a; --soft:#eef1f5;
  --accent:#1f5eff; --accent-fg:#fff; --ok:#13914b; --warn:#c27a00; --bad:#c0392b; --info:#2f6fdb; --violet:#8a5cf6;
  --reddit:#ff4500; --medium:#2b2b2b; --youtube:#e62117;
  --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif; --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1217; --surface:#171b22; --line:#272d37; --fg:#e9edf3; --muted:#9aa5b4; --soft:#1f242d;
  --accent:#6b93ff; --accent-fg:#0b1020; --medium:#cfcfcf; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:920px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 64px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h1{font-size:2rem;line-height:1.15;text-wrap:balance}
h2{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
a{color:var(--accent)}
/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:inline-block}
.who{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:999px;width:max-content;max-width:100%;overflow-x:auto}
.tab{border:0;background:none;color:var(--muted);font:600 .92rem var(--body);padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:.75rem;line-height:20px;text-align:center;margin-left:4px}
/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.stat .n{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .n small{font-size:.9rem;color:var(--muted);font-weight:500}
.prog{height:8px;background:var(--soft);border-radius:999px;overflow:hidden}.prog i{display:block;height:100%;border-radius:999px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.item .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.item .title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:1rem;min-width:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}
.meta a{overflow-wrap:anywhere}
.pill{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.tag{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pay{font-family:var(--display);font-weight:700;font-size:1.05rem;white-space:nowrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.note{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px;font-size:1.05rem}
/* forms */
label{display:flex;flex-direction:column;gap:5px;font-size:.84rem;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 16px;font:600 .92rem var(--body);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.check{display:flex;flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--fg);font-size:.95rem}
.check input{width:auto}
.platbox{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
/* landing */
.hero{display:flex;flex-direction:column;gap:12px;padding:26px 0 6px}
.rates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.rate .big{font-family:var(--display);font-size:1.7rem;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.step{display:flex;gap:10px;align-items:flex-start}
.step span{width:28px;height:28px;border-radius:50%;background:var(--soft);font-weight:700;display:grid;place-items:center;flex:none}
.google{display:inline-flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);border:0;border-radius:12px;padding:13px 20px;font:600 1rem var(--body);cursor:pointer;width:max-content}
.banner{background:#fff4d6;color:#6b4a00;border-radius:12px;padding:10px 14px;font-size:.88rem}
@media (prefers-color-scheme: dark){.banner{background:#3a2e10;color:#ffd98a}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px);z-index:50}
@media (max-width:680px){
  .grid2,.rates,.steps{grid-template-columns:1fr}
  .grid3{gap:8px}.stat{padding:10px}.stat .n{font-size:1.25rem}.stat .muted.small{font-size:.74rem}
  h1{font-size:1.6rem}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="logo"><i></i><span id="brandName">Creator Portal</span></div>
    <div class="who" id="who" hidden><span id="whoName"></span><button class="btn sm" id="signout">Sign out</button></div>
  </div>
  <div id="preview" class="banner" hidden>Preview mode: nothing is saved. <span id="previewSwitch"></span></div>
  <main id="app"><div class="empty"><b>Loading…</b></div></main>
</div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const C = window.PORTAL_CONFIG;
const PLAT = {reddit:{name:"Reddit",color:"var(--reddit)"},medium:{name:"Medium",color:"var(--medium)"},youtube:{name:"YouTube",color:"var(--youtube)"}};
const TYPE = {post:"Post",comment:"Comments",article:"Article",video:"Video mention"};
const UNIT = {post:"per post",comment:"per week",article:"per article",video:"per video"};
const CSTAT = {pending:["Waiting for review","var(--warn)"],approved:["Approved","var(--ok)"],rejected:["Not approved","var(--bad)"]};
const SSTAT = {submitted:["Checking","var(--info)"],accepted:["Accepted · to be paid","var(--violet)"],paid:["Paid","var(--ok)"],rejected:["Not accepted","var(--bad)"]};
const $ = id => document.getElementById(id);
document.title = C.brand + " Creator Portal";
$("brandName").textContent = C.brand + " Creators";

function h(tag, props, ...kids){
  const el=document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})){
    if (v===undefined||v===null||v===false) continue;
    if (k==="class") el.className=v; else if (k==="text") el.textContent=v; else if (k==="style") el.style.cssText=v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2),v); else el.setAttribute(k,v===true?"":v);
  }
  for (const c of kids.flat()) if (c!=null&&c!==false) el.append(c instanceof Node?c:document.createTextNode(String(c)));
  return el;
}
const safeUrl = u => { u=(u||"").trim(); if(!u) return ""; if(!/^https?:\/\//i.test(u)) u="https://"+u.replace(/^\/+/,""); return /^https:\/\//i.test(u)?u:u.replace(/^http:/i,"https:"); };
const linkEl = (u,label) => { const s=safeUrl(u); return s? h("a",{href:s,target:"_blank",rel:"noopener",text:label||s.replace(/^https:\/\//,"")}) : null; };
const money = n => "$"+(Math.round((+n||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
const ago = t => { if(!t) return ""; const d=(Date.now()-t)/1000; if(d<3600) return Math.max(1,Math.round(d/60))+" min ago"; if(d<86400) return Math.round(d/3600)+" h ago"; return Math.round(d/86400)+" d ago"; };
let tt; function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2600); }
const pill = ([txt,c]) => h("span",{class:"pill",style:"background:"+c,text:txt});
const platDot = p => h("span",{class:"dot",style:"background:"+(PLAT[p]||PLAT.reddit).color,title:(PLAT[p]||{}).name});

/* ============ data layer: Firebase or preview ============ */
const LIVE = !!(C.firebase && C.firebase.apiKey);
let S; // store
if (LIVE){
  firebase.initializeApp(C.firebase);
  const auth=firebase.auth(), fs=firebase.firestore();
  const snapList = q => (cb)=>q.onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))), e=>{console.error(e); toast("Couldn't load: "+e.code);});
  S = {
    onAuth: cb => auth.onAuthStateChanged(u=>cb(u?{uid:u.uid,name:u.displayName||u.email,email:u.email,photo:u.photoURL}:null)),
    signIn: () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{
      if (e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment") return auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
      toast("Sign-in failed: "+(e.message||e.code)); }),
    signOut: () => auth.signOut(),
    isAdmin: async u => { try{ return (await fs.collection("admins").doc(u.email).get()).exists; }catch(e){ return false; } },
    watchMe: (uid,cb) => fs.collection("creators").doc(uid).onSnapshot(d=>cb(d.exists?{id:d.id,...d.data()}:null), e=>{console.error(e);cb(null);}),
    saveMe: (uid,data,create) => create ? fs.collection("creators").doc(uid).set(data) : fs.collection("creators").doc(uid).update(data),
    watchJobs: snapList(fs.collection("jobs")),
    saveJob: (id,data) => id ? fs.collection("jobs").doc(id).update(data) : fs.collection("jobs").add(data),
    delJob: id => fs.collection("jobs").doc(id).delete(),
    watchMySubs: (uid,cb) => snapList(fs.collection("submissions").where("uid","==",uid))(cb),
    addSub: data => fs.collection("submissions").add(data),
    watchCreators: snapList(fs.collection("creators")),
    setCreator: (uid,data) => fs.collection("creators").doc(uid).update(data),
    watchSubs: snapList(fs.collection("submissions")),
    setSub: (id,data) => fs.collection("submissions").doc(id).update(data)
  };
} else {
  // Preview: in-memory sample data so you can click through both sides.
  const now=Date.now();
  const db={
    creators:{c1:{name:"maya_writes",email:"maya@example.com",status:"approved",platforms:{reddit:{link:"reddit.com/user/maya_writes",karma:4200,age:"3 years"}},payMethod:"PayPal",payDetails:"maya@example.com",country:"Kenya",createdAt:now-5e8},
              c2:{name:"techdaily",email:"td@example.com",status:"pending",platforms:{medium:{link:"medium.com/@techdaily"}},payMethod:"USDT (TRC20)",payDetails:"T...",country:"Nigeria",createdAt:now-8e6},
              c3:{name:"okafor_reviews",email:"ok@example.com",status:"pending",platforms:{youtube:{link:"youtube.com/@okaforreviews",subs:2300}},payMethod:"Bank",payDetails:"GTBank ...",country:"Nigeria",createdAt:now-3e6}},
    jobs:{j1:{title:"Honest post about "+C.brand,platform:"reddit",type:"post",pay:C.rates.reddit_post,instructions:"Share your real experience in a subreddit where it fits. Add a short note that it's a partner post.",link:"",open:true,createdAt:now-4e8},
          j2:{title:"Weekly comments",platform:"reddit",type:"comment",pay:C.rates.reddit_comment,instructions:"Join 5+ conversations this week where "+C.brand+" is relevant. Send the links.",link:"",open:true,createdAt:now-3e8}},
    submissions:{s1:{uid:"c1",creatorName:"maya_writes",jobId:"j1",jobTitle:"Honest post about "+C.brand,platform:"reddit",pay:C.rates.reddit_post,proofLink:"reddit.com/r/example/comments/abc",note:"",status:"accepted",createdAt:now-2e8},
                 s2:{uid:"c1",creatorName:"maya_writes",jobId:"j2",jobTitle:"Weekly comments",platform:"reddit",pay:C.rates.reddit_comment,proofLink:"reddit.com/user/maya_writes/comments",note:"5 comments",status:"submitted",createdAt:now-4e6}}
  };
  const subs=new Set(); const fire=()=>subs.forEach(f=>f());
  const watch=(get)=>cb=>{const f=()=>cb(get()); subs.add(f); f(); return ()=>subs.delete(f);};
  const arr=k=>Object.entries(db[k]).map(([id,v])=>({id,...v}));
  let role="creator";
  const users={creator:{uid:"c1",name:"maya_writes (sample creator)",email:"maya@example.com"},admin:{uid:"a1",name:"Admin (sample)",email:"admin@example.com"},new:{uid:"n1",name:"New visitor (sample)",email:"new@example.com"}};
  let authCb=null;
  S={
    onAuth:cb=>{authCb=cb; cb(null);},
    signIn:()=>authCb(users[role]),
    signOut:()=>authCb(null),
    isAdmin:async u=>u.uid==="a1",
    watchMe:(uid,cb)=>watch(()=>db.creators[uid]?{id:uid,...db.creators[uid]}:null)(cb),
    saveMe:async(uid,data,create)=>{db.creators[uid]=create?data:{...db.creators[uid],...data}; fire();},
    watchJobs:watch(()=>arr("jobs")),
    saveJob:async(id,data)=>{ if(id) Object.assign(db.jobs[id],data); else db.jobs["j"+Date.now()]=data; fire();},
    delJob:async id=>{delete db.jobs[id]; fire();},
    watchMySubs:(uid,cb)=>watch(()=>arr("submissions").filter(s=>s.uid===uid))(cb),
    addSub:async data=>{db.submissions["s"+Date.now()]=data; fire();},
    watchCreators:watch(()=>arr("creators")),
    setCreator:async(uid,data)=>{Object.assign(db.creators[uid],data); fire();},
    watchSubs:watch(()=>arr("submissions")),
    setSub:async(id,data)=>{Object.assign(db.submissions[id],data); fire();}
  };
  $("preview").hidden=false;
  const sw=h("select",{style:"width:auto;display:inline-block;padding:4px 8px;margin-left:6px",onchange:e=>{role=e.target.value; if(current) S.signIn();}},
    h("option",{value:"creator",text:"See it as an approved creator"}),h("option",{value:"new",text:"See it as a new creator"}),h("option",{value:"admin",text:"See it as admin"}));
  $("previewSwitch").append("Try:",sw);
}

/* ============ app ============ */
let current=null, unsub=[];
const app=$("app");
function clearSubs(){ unsub.forEach(f=>{try{f()}catch(e){}}); unsub=[]; }
$("signout").addEventListener("click",()=>S.signOut());

S.onAuth(async u=>{
  clearSubs(); current=u;
  $("who").hidden=!u; if(u) $("whoName").textContent=u.name;
  if(!u){ renderLanding(); return; }
  if (await S.isAdmin(u)){ renderAdmin(); return; }
  unsub.push(S.watchMe(u.uid, me=>renderCreator(me)));
});

/* ---------- landing ---------- */
function renderLanding(){
  const r=C.rates;
  app.replaceChildren(
    h("section",{class:"hero"},
      h("h1",{text:`Get paid to share your honest take on ${C.brand}`}),
      h("p",{class:"muted",text:`${C.brand} is ${C.brandAbout}. We work with real Reddit, Medium and YouTube creators who have a genuine posting history.`}),
      h("button",{class:"google",onclick:()=>S.signIn()},"Continue with Google")),
    h("div",{class:"rates"},
      h("div",{class:"rate"},h("span",{class:"muted small"},platDot("reddit")," Reddit post"),h("span",{class:"big",text:money(r.reddit_post)}),h("span",{class:"muted small",text:"per post"})),
      h("div",{class:"rate"},h("span",{class:"muted small"},platDot("reddit")," Reddit comments"),h("span",{class:"big",text:money(r.reddit_comment)}),h("span",{class:"muted small",text:"per week"})),
      h("div",{class:"rate"},h("span",{class:"muted small"},platDot("medium")," ",platDot("youtube")," Medium & YouTube"),h("span",{class:"big",text:"Ask"}),h("span",{class:"muted small",text:"rate agreed after approval"}))),
    h("div",{class:"panel"},
      h("h2",{text:"How it works"}),
      h("div",{class:"steps"},
        h("div",{class:"step"},h("span",{text:"1"}),h("div",{},h("b",{text:"Apply"}),h("p",{class:"muted small",text:"Sign in and add your profile links."}))),
        h("div",{class:"step"},h("span",{text:"2"}),h("div",{},h("b",{text:"Get approved"}),h("p",{class:"muted small",text:"We check your account history, usually within 48 hours."}))),
        h("div",{class:"step"},h("span",{text:"3"}),h("div",{},h("b",{text:"Post and get paid"}),h("p",{class:"muted small",text:"Pick a job, post, send the link. We pay after checking."})))),
      h("p",{class:"muted small",text:"Requirements for Reddit: an account with real history (several months old, many posts and comments, some karma). Partner posts should say they are sponsored where the subreddit requires it."})));
}

/* ---------- creator side ---------- */
let ctab="jobs", jobsCache=[], mySubsCache=[];
function renderCreator(me){
  if(!me){ renderApply(null); return; }
  if(me.status==="pending"){
    app.replaceChildren(h("div",{class:"panel"},pill(CSTAT.pending),h("h2",{text:"Application received"}),
      h("p",{class:"muted",text:"We're checking your profile. This page updates by itself once you're approved, usually within 48 hours."}),
      h("div",{class:"acts"},h("button",{class:"btn",onclick:()=>renderApply(me),text:"Edit my application"}))));
    return;
  }
  if(me.status==="rejected"){
    app.replaceChildren(h("div",{class:"panel"},pill(CSTAT.rejected),h("h2",{text:"Not approved this time"}),
      h("p",{class:"muted",text:me.adminNote||"Your account doesn't meet the requirements yet. Keep building your posting history and apply again later."})));
    return;
  }
  // approved
  if(!unsub.jobs){ unsub.jobs=true;
    unsub.push(S.watchJobs(j=>{jobsCache=j; drawCreator(me);}));
    unsub.push(S.watchMySubs(me.id,s=>{mySubsCache=s; drawCreator(me);})); }
  drawCreator(me);
}
function drawCreator(me){
  const open=jobsCache.filter(j=>j.open!==false).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const subs=[...mySubsCache].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const earned=subs.filter(s=>s.status==="paid").reduce((a,s)=>a+(+s.pay||0),0);
  const due=subs.filter(s=>s.status==="accepted").reduce((a,s)=>a+(+s.pay||0),0);
  const checking=subs.filter(s=>s.status==="submitted").length;
  const tabs=h("div",{class:"tabs",role:"tablist"},
    ...[["jobs","Jobs"],["work","My work"],["profile","Profile"]].map(([k,n])=>h("button",{class:"tab",role:"tab","aria-selected":ctab===k?"true":"false",onclick:()=>{ctab=k;drawCreator(me);}},n)));
  const sum=h("div",{class:"grid3"},
    h("div",{class:"stat"},h("span",{class:"muted small",text:"Paid to you"}),h("span",{class:"n",text:money(earned)})),
    h("div",{class:"stat"},h("span",{class:"muted small",text:"Coming to you"}),h("span",{class:"n",text:money(due)})),
    h("div",{class:"stat"},h("span",{class:"muted small",text:"Being checked"}),h("span",{class:"n",text:String(checking)})));
  let body;
  if(ctab==="jobs"){
    body = open.length ? h("div",{class:"list"},...open.map(j=>jobCard(j,me))) : h("div",{class:"empty"},h("b",{text:"No open jobs right now"}),"New jobs show up here. Check back soon.");
  } else if(ctab==="work"){
    body = subs.length ? h("div",{class:"list"},...subs.map(s=>h("div",{class:"item"},
      h("div",{class:"head"},h("div",{class:"title"},platDot(s.platform),s.jobTitle||"Job"),pill(SSTAT[s.status]||SSTAT.submitted)),
